<text x="1050" y="590" text-anchor="end" font-size="12" fill="#4a5568">SMS: handler code exists in the repository, no SMS number is provisioned and none is claimed.</text>
<text x="206" y="610" font-size="12" fill="#4a5568">One email in, one reply out. Resources are defined in infra/template.yaml and engine/template.yaml; SES v2 SendEmail and Bedrock Converse are SDK calls.</text>
