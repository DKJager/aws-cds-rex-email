<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="Arial, Helvetica, sans-serif">
<title>Architecture: Rex by 3Dogs Nexus, AWS CDS Agentic AI Hackathon (email edition)</title>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4a5568"/></marker></defs>
<rect width="1240" height="640" fill="#f7f8fa"/>
<rect x="190" y="14" width="1040" height="612" rx="14" fill="none" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="206" y="36" font-size="13" font-weight="700" fill="#4a5568">AWS Cloud, us-east-1 (stacks awscds-demo and awscds-engine)</text>
<rect x="20" y="255" width="140" height="76" rx="10" fill="#f6d365" stroke="#c9a227" stroke-width="1.6"/><text x="90.0" y="281" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Judge</text><text x="90.0" y="303" text-anchor="middle" font-size="12.5" fill="#1b2330">sends a plain-text</text><text x="90.0" y="321" text-anchor="middle" font-size="12.5" fill="#1b2330">email</text>
<rect x="20" y="64" width="140" height="76" rx="10" fill="#f6d365" stroke="#c9a227" stroke-width="1.6"/><text x="90.0" y="90" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Judge</text><text x="90.0" y="112" text-anchor="middle" font-size="12.5" fill="#1b2330">receives the reply</text><text x="90.0" y="130" text-anchor="middle" font-size="12.5" fill="#1b2330">(Agent steps block)</text>
<rect x="215" y="235" width="200" height="116" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="315.0" y="261" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Amazon SES (inbound)</text><text x="315.0" y="283" text-anchor="middle" font-size="12.5" fill="#1b2330">receipt rule set awscds-inbound</text><text x="315.0" y="301" text-anchor="middle" font-size="12.5" fill="#1b2330">judges@cds.3dogs.ai</text><text x="315.0" y="319" text-anchor="middle" font-size="12.5" fill="#1b2330">TLS required</text>
<rect x="215" y="420" width="200" height="84" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="315.0" y="446" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Amazon S3</text><text x="315.0" y="468" text-anchor="middle" font-size="12.5" fill="#1b2330">inbound/ raw mail</text>
<rect x="215" y="64" width="200" height="84" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="315.0" y="90" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Amazon SES v2 (outbound)</text><text x="315.0" y="112" text-anchor="middle" font-size="12.5" fill="#1b2330">SendEmail from</text><text x="315.0" y="130" text-anchor="middle" font-size="12.5" fill="#1b2330">judges@cds.3dogs.ai</text>
<rect x="480" y="195" width="250" height="176" rx="10" fill="#ff9900" stroke="#c77700" stroke-width="1.6"/><text x="605.0" y="221" text-anchor="middle" font-weight="700" font-size="15" fill="#1b1300">AWS Lambda: orchestrator</text><text x="605.0" y="243" text-anchor="middle" font-size="12.5" fill="#1b1300">src/orchestrator.py</text><text x="605.0" y="261" text-anchor="middle" font-size="12.5" fill="#1b1300">parse mail · load session</text><text x="605.0" y="279" text-anchor="middle" font-size="12.5" fill="#1b1300">forward stored correction</text><text x="605.0" y="297" text-anchor="middle" font-size="12.5" fill="#1b1300">call engine · build reply</text><text x="605.0" y="315" text-anchor="middle" font-size="12.5" fill="#1b1300">allowlist and mail-loop guard</text>
<rect x="480" y="450" width="250" height="84" rx="10" fill="#3b3bb0" stroke="#2a2a80" stroke-width="1.6"/><text x="605.0" y="476" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">Amazon DynamoDB</text><text x="605.0" y="498" text-anchor="middle" font-size="12.5" fill="#ffffff">conversation per sender</text><text x="605.0" y="516" text-anchor="middle" font-size="12.5" fill="#ffffff">email:&lt;sender&gt; · 7-day TTL</text>
<rect x="480" y="44" width="250" height="84" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="605.0" y="70" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Amazon SQS dead-letter queue</text><text x="605.0" y="92" text-anchor="middle" font-size="12.5" fill="#1b2330">failed async invokes</text><text x="605.0" y="110" text-anchor="middle" font-size="12.5" fill="#1b2330">→ CloudWatch alarm</text>
<rect x="810" y="195" width="250" height="110" rx="10" fill="#6b5fe6" stroke="#4a3fb8" stroke-width="1.6"/><text x="935.0" y="221" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">Engine Lambda (engine/)</text><text x="935.0" y="243" text-anchor="middle" font-size="12.5" fill="#ffffff">Function URL · bearer token</text><text x="935.0" y="261" text-anchor="middle" font-size="12.5" fill="#ffffff">Python 3.12 · boto3 only</text>
<rect x="810" y="44" width="250" height="84" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/><text x="935.0" y="70" text-anchor="middle" font-weight="700" font-size="15" fill="#1b2330">Amazon Bedrock (Converse)</text><text x="935.0" y="92" text-anchor="middle" font-size="12.5" fill="#1b2330">openai.gpt-oss-120b-1:0</text><text x="935.0" y="110" text-anchor="middle" font-size="12.5" fill="#1b2330">fallback amazon.nova-pro-v1:0</text>
<rect x="810" y="400" width="250" height="84" rx="10" fill="#3b3bb0" stroke="#2a2a80" stroke-width="1.6"/><text x="935.0" y="426" text-anchor="middle" font-weight="700" font-size="15" fill="#ffffff">Amazon DynamoDB</text><text x="935.0" y="448" text-anchor="middle" font-size="12.5" fill="#ffffff">awscds-engine-sessions</text><text x="935.0" y="466" text-anchor="middle" font-size="12.5" fill="#ffffff">last 6 messages · 2-day TTL</text>
